<!doctype html>
<html lang="en" data-theme="familyfoto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilyFoto</title><link rel="stylesheet" href="/web/cropper.min.css"><link rel="stylesheet" href="/web/daisyui-5.7.50.css"><link rel="stylesheet" href="/web/styles.css"></head>
<body><div class="layout"><aside><h1>FamilyFoto</h1><p id="buildLabel" class="build-label" hidden></p><p class="muted">Family media library</p><nav aria-label="Library"><button data-view="albums">Albums</button><button data-view="all" class="active">Library</button><button data-view="image">Photos</button><button data-view="video">Videos</button><button data-view="imports">Imports</button><button data-view="uploads">Uploads</button><button data-view="settings">Settings</button><button data-view="trash">Recently Deleted</button></nav><div class="sidebar-status" role="status" aria-live="polite"><span id="sideDot" class="dot idle"></span><span id="sideState">Initializing...</span></div></aside>
<main><header><div><h2 id="heading">Library</h2><p class="muted" id="summary">Connecting...</p></div><div class="job-progress"><div class="run-state"><span class="dot idle" id="runDot"></span><span id="runTime">Initializing...</span></div><progress id="progress" max="100" value="0" aria-label="Files processed"></progress><small id="progressCount">No import yet</small><progress id="byteProgress" max="100" value="0" aria-label="Bytes processed"></progress><small id="byteProgressCount">No byte progress yet</small><div id="videoProgressSection" hidden><progress id="videoProgress" max="100" value="0" aria-label="Videos processed"></progress><small id="videoProgressCount"></small></div></div></header>
<p id="importEstimate" class="muted" aria-live="polite" title="Approximate estimate based on active time and file/byte progress; file mix and disk speed can change it."></p>
<p id="notice" class="notice" role="status" hidden></p>
<section id="library"><div class="toolbar"><input id="search" type="search" placeholder="Search filenames or source paths" aria-label="Search library"><select id="year" aria-label="Capture year"><option value="all">All years</option><option value="unknown">Unknown date</option></select><select id="importFilter" aria-label="Import name"><option value="all">All imports</option></select></div><p id="libraryEmpty" role="status" hidden></p><div id="grid" class="grid" aria-label="Media library"></div><footer><span id="range"></span><div><button id="previous" aria-label="Previous page" title="Previous page">&larr;</button><input id="pageNumber" type="number" min="1" step="1" value="1" aria-label="Page number"><span id="pageCount"></span><button id="next" aria-label="Next page" title="Next page">&rarr;</button></div></footer></section>
<section id="imports" class="details" hidden></section>
<section id="uploads" class="details" hidden></section>
<section id="storage" class="details" hidden><details id="ignoredTypes" class="settings-section"><summary>Ignored file types</summary><p id="ignorePatterns"></p></details><details class="settings-section" id="diskStatus"><summary>Disk status</summary><div class="section-heading"><p id="storageChecked" class="muted"></p><button id="storageRefresh" aria-label="Refresh disk capacity" title="Refresh disk capacity"><i data-lucide="refresh-cw"></i></button></div><h3>Source</h3><dl id="sourceDetails"></dl><h3>Destination</h3><dl id="destinationDetails"></dl><h3>Disk monitor</h3><dl id="monitorDetails"></dl></details></section>
</main></div><dialog id="viewer" aria-label="Media preview"><div class="viewer-heading"><div class="viewer-navigation"></div><div class="viewer-navigation"><button id="viewerInfo" aria-label="More information" title="More information" aria-expanded="false" aria-controls="viewerDetails"><i data-lucide="info"></i></button><button id="viewerCrop" aria-label="Crop photo" title="Crop photo"><i data-lucide="crop"></i></button><button id="viewerRotate" aria-label="Rotate clockwise" title="Rotate 90 degrees clockwise"><i data-lucide="rotate-cw"></i></button><button id="viewerTrash" aria-label="Move to trash" title="Move to trash"><i data-lucide="trash-2"></i></button><button id="viewerRestore" aria-label="Restore" title="Restore" hidden><i data-lucide="undo-2"></i></button><button id="viewerDelete" aria-label="Delete permanently" title="Delete permanently" hidden><i data-lucide="trash-2"></i></button><button id="closeViewer" aria-label="Close preview" title="Close preview"><i data-lucide="x"></i></button></div></div><div id="fullMedia"></div><div id="cropEditor" hidden><img id="cropImage" alt="Crop selection"></div><div id="cropActions" hidden><button id="cropReset" title="Reset crop" aria-label="Reset crop"><i data-lucide="undo-2"></i></button><button id="cropCancel">Cancel</button><button id="cropSave">Save crop</button></div><button id="viewerPrevious" aria-label="Previous image" title="Previous image"><i data-lucide="chevron-left"></i></button><button id="viewerNext" aria-label="Next image" title="Next image"><i data-lucide="chevron-right"></i></button><p id="captureTime"></p><section id="viewerDetails" hidden aria-label="Media information"><dl id="mediaDetails"></dl></section></dialog><script src="/web/cropper.min.js"></script><script src="/web/lucide.min.js"></script><script type="module" src="/web/app.js"></script><script type="module" src="/web/ui.mjs"></script></body></html>
