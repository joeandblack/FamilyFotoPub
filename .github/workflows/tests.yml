name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all groups for release qualification
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Release callers run every group by default
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.groups.outputs.database }}
      swift: ${{ steps.groups.outputs.swift }}
      apfs: ${{ steps.groups.outputs.apfs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: groups
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          HEAD: ${{ github.sha }}
          FULL: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            python -m scripts.ci_tests --full
          else
            python -m scripts.ci_tests --base "$BASE" --head "$HEAD"
          fi

  safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-faces-windows.txt
      - run: python -m pytest tests face_detect/tests -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs

  macos-core:
    needs: plan
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-tests
        with:
          media-tools: 'true'
      - run: python -m pytest -p scripts.ci_tests --ci-group core --ci-shards 2 --ci-shard ${{ matrix.shard }} -q --durations=10

  macos-database:
    needs: plan
    if: needs.plan.outputs.database == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      LC_ALL: en_US.UTF-8
      FAMILYFOTO_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-tests
        with:
          media-tools: 'true'
      - name: Start this job's disposable PostgreSQL
        run: |
          brew install postgresql@17
          PGBIN="$(brew --prefix postgresql@17)/bin"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55432 -k /tmp" -l "$RUNNER_TEMP/pg.log" -w start
          "$PGBIN/psql" -h 127.0.0.1 -p 55432 -U postgres \
            -c "CREATE USER familyfoto SUPERUSER PASSWORD 'ci'" \
            -c "CREATE DATABASE familyfoto OWNER familyfoto"
      - name: Configure only the disposable catalog
        run: |
          python - <<'PY'
          import json
          config = json.load(open('config/example.json'))
          config['database'].update(port=55432, password='ci')
          config['video_tools'] = {'ffmpeg': '/opt/homebrew/bin/ffmpeg', 'ffprobe': '/opt/homebrew/bin/ffprobe'}
          with open('config/local.json', 'w') as stream:
              json.dump(config, stream)
          PY
          python -c "from app.database import migrate, close_pools; migrate(); close_pools()"
      - run: python -m pytest -p scripts.ci_tests --ci-group database --ci-shards 2 --ci-shard ${{ matrix.shard }} -q --durations=10
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          PGBIN="$(brew --prefix postgresql@17)"
          if [ -f "$RUNNER_TEMP/pg/postmaster.pid" ]; then
            "$PGBIN/bin/pg_ctl" -D "$RUNNER_TEMP/pg" -m immediate -w stop
          fi

  macos-swift:
    needs: plan
    if: needs.plan.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-tests
      - run: python -m pytest -p scripts.ci_tests --ci-group swift -q --durations=10

  macos-apfs:
    needs: plan
    if: needs.plan.outputs.apfs == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-tests
      - run: python -m pytest -p scripts.ci_tests --ci-group apfs -q --durations=10

  # Keep the existing required check name. An expected job failure/cancellation
  # must not turn green merely because a dependent job was skipped.
  macos:
    if: always()
    needs: [plan, javascript, macos-core, macos-database, macos-swift, macos-apfs]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name in ('plan', 'javascript', 'macos-core'):
              assert results[name]['result'] == 'success', (name, results[name]['result'])
          for group in ('database', 'swift', 'apfs'):
              expected = 'success' if results['plan']['outputs'][group] == 'true' else 'skipped'
              actual = results['macos-' + group]['result']
              assert actual == expected, (group, expected, actual)
          PY
