name: Python test environment
description: Isolated Python dependencies for one hosted test job
inputs:
  media-tools:
    description: Install ffmpeg for media tests
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements*.txt
          face_detect/config/dependencies/people-macos-arm64.txt
    - shell: bash
      run: python -m pip install -r requirements-dev.txt -r face_detect/config/dependencies/people-macos-arm64.txt
    - if: inputs.media-tools == 'true'
      shell: bash
      run: brew install ffmpeg
